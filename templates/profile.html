{% extends "base.html" %}

{% block title %}Profile — Spendly{% endblock %}

{% block content %}

<div class="profile-hero">
    <div class="profile-avatar">{{ user.name[0].upper() }}</div>
    <h1 class="profile-name">{{ user.name }}</h1>
    <p class="profile-email">{{ user.email }}</p>
    <p class="profile-since">Member since {{ member_since }}</p>
</div>

<div class="profile-edit-section">
    <div class="profile-cards-grid">

        <div class="profile-form-card">
            <div class="profile-form-card-header">
                <i data-lucide="user"></i>
                <span class="profile-form-card-title">Account Details</span>
            </div>
            <form method="POST" action="{{ url_for('profile') }}">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" class="form-input"
                           value="{{ user.name }}" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" class="form-input"
                           value="{{ user.email }}" required>
                </div>
                <button type="submit" class="btn-submit">Save changes</button>
            </form>
        </div>

        <div class="profile-form-card">
            <div class="profile-form-card-header">
                <i data-lucide="lock"></i>
                <span class="profile-form-card-title">Change Password</span>
            </div>
            <form method="POST" action="{{ url_for('profile_password') }}">
                <div class="form-group">
                    <label for="current_password">Current Password</label>
                    <input type="password" id="current_password" name="current_password"
                           class="form-input" required>
                </div>
                <div class="form-group">
                    <label for="new_password">New Password</label>
                    <input type="password" id="new_password" name="new_password"
                           class="form-input" required>
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirm New Password</label>
                    <input type="password" id="confirm_password" name="confirm_password"
                           class="form-input" required>
                </div>
                <button type="submit" class="btn-submit">Update password</button>
            </form>
        </div>

    </div>
</div>

{% endblock %}
